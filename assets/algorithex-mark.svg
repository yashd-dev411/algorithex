<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Algorithex">
  <title>Algorithex</title>
  <defs>
    <!-- Same indigo-to-violet family the dashboard uses for its active states,
         so the README mark and the running app read as one product. -->
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Hexagon: keeps the silhouette the dashboard already uses, so the mark
       reads as "this app" rather than a new product bolted on. -->
  <path d="M64 4 118 34v60L64 124 10 94V34Z"
        fill="none" stroke="url(#hex)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Ascending series with nodes: research turning into a result. -->
  <polyline points="30,90 48,70 64,80 88,44 100,52"
            fill="none" stroke="url(#trend)" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="90" r="6.5" fill="#22d3ee"/>
  <circle cx="64" cy="80" r="6.5" fill="#4ade80"/>
  <circle cx="100" cy="52" r="6.5" fill="#4ade80"/>
</svg>
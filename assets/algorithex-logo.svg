<!-- viewBox width is sized to the subtitle, not the wordmark: "ALGORITHEX"
     ends around x=490, but the letter-spaced subtitle runs to about x=670.
     A viewBox cut to the wordmark silently clips the tagline, which is
     exactly what the first version of this file did. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" width="780" height="140" role="img" aria-label="Algorithex">
  <title>Algorithex</title>
  <defs>
    <linearGradient id="hex2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="trend2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(6 6) scale(1.0)">
    <path d="M64 4 118 34v60L64 124 10 94V34Z"
          fill="none" stroke="url(#hex2)" stroke-width="7" stroke-linejoin="round"/>
    <polyline points="30,90 48,70 64,80 88,44 100,52"
              fill="none" stroke="url(#trend2)" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="90" r="6.5" fill="#22d3ee"/>
    <circle cx="64" cy="80" r="6.5" fill="#4ade80"/>
    <circle cx="100" cy="52" r="6.5" fill="#4ade80"/>
  </g>

  <!-- Wordmark. Two weights, because the product name is the thing that has to
       survive being shrunk to 72px in a README header. -->
  <text x="152" y="72"
        font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="1.5"
        fill="url(#word)">ALGORITHEX</text>
  <text x="155" y="102"
        font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="4.2"
        fill="#94a3b8">SELF-HOSTED RESEARCH &amp; EXECUTION</text>
</svg>
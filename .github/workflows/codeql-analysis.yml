# Security scanning for pushes to master.
#
# The inherited version of this workflow pinned checkout@v2, cache@v2 and
# codeql-action@v1. Those have been disabled by GitHub, so the workflow does not
# run at all -- which is worse than not having it, because it reads as coverage
# that is not there. Action versions are current as of writing; a repo that
# publishes publicly should keep them current.

name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a newly disclosed advisory is caught even with no new commits.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # javascript-typescript needs no build step: the frontend in this
          # repository is a prebuilt bundle with no sources to compile.
          build-mode: ${{ matrix.language == 'javascript-typescript' && 'none' || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

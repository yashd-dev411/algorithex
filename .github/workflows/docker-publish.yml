# Publish the Algorithex image to GitHub Container Registry.
#
# This replaces an inherited workflow that published to PyPI and Docker Hub on
# any `v*` tag, under a namespace this project does not own, using secrets that
# do not exist here. Nothing in this file can publish anywhere except GHCR, and
# the namespace is derived from the repository rather than hardcoded, so the
# same workflow is correct for any GitHub account it is pushed to.
#
# Consuming the result:
#   docker pull ghcr.io/<owner>/<repo>:latest
#
# For anyone but the repository owner, GHCR packages are private by default and
# must be switched to public in the package settings, or pulled with a PAT that
# has `read:packages`.

name: Publish image

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: reading the repository is all the build needs, writing
# packages is what the push requires.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # A quick, single-architecture image on every push to master, so a broken
  # Dockerfile fails within minutes rather than at release time.
  amd64:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # TEST_BUILD must stay 0. The Dockerfile selects its final stage with
      # `FROM algorithex_with_test_${TEST_BUILD}`, and stage 1 ends in
      # `ENTRYPOINT pytest` -- building with TEST_BUILD=1 would ship a container
      # whose entrypoint is the test suite.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Multi-arch only for releases and manual runs. Compiling numpy and Cython
  # from source under QEMU emulation for arm64 is slow enough that doing it on
  # every push would burn the runner budget for an image nobody has asked for.
  multiarch:
    name: Build and push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    needs: amd64
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

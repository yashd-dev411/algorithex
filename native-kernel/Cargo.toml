[package]
name = "algorithex_kernel"
version = "1.3.0"
edition = "2021"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "algorithex_kernel"
crate-type = ["cdylib"]

[features]
# The stable ABI lets a single binary serve every CPython 3.10+ on a platform,
# which is what `algorithex/_native/__init__.py` assumes when it loads one file
# per platform. It is also what makes cross-compiling possible at all, since a
# version-specific build needs the target interpreter's headers.
default = ["abi3"]
abi3 = ["pyo3/abi3-py310"]

[dependencies]
pyo3 = { version = "0.20.3", features = ["extension-module"] }
numpy = "0.20.0"
ndarray = "0.15.6"
rust_decimal = "1.35.0"

# Optimize for size and performance in release builds
[profile.release]
opt-level = 3          # Maximum optimization
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization but slower compile
panic = "abort"       # Smaller binaries
strip = "symbols"     # Remove debug symbols

# Size-focused optimization profile
[profile.release-small]
inherits = "release"
opt-level = "z"       # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
